name: Build NexTags AI Desktop

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build:
    # tauri-action cria o release e sobe os binarios; o GITHUB_TOKEN padrao e
    # somente-leitura em repos novos, o que faria o passo de release falhar com 403.
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
            rust_targets: "aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
            rust_targets: "x86_64-apple-darwin"
          # Pinado: o conjunto de pacotes apt abaixo e valido no 24.04. O
          # ubuntu-latest vai migrar pro 26.04, onde libappindicator3-dev nao existe mais.
          - platform: ubuntu-24.04
            args: ""
            rust_targets: ""
          - platform: windows-latest
            args: ""
            rust_targets: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.rust_targets }}

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          # O tag do release e sempre app-v<versao do tauri.conf.json>, nao o tag empurrado.
          # O prefixo "app-" e proposital: evita que publicar o release dispare este
          # workflow de novo pelo gatilho `push: tags: v*`.
          tagName: app-v__VERSION__
          releaseName: "NexTags AI v__VERSION__"
          releaseDraft: true
          prerelease: false
